<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Prospect Heat Map</title>

  <!-- Leaflet (map) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet.heat (heat layer) -->
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <!-- opening_hours.js: evaluates OSM opening_hours strings against a given time.
       The old "+deps.min.js" bundle was dropped upstream (that URL 404s, which
       silently disabled every hours-based feature), so load its one runtime dep,
       suncalc, first — the UMD build reads it off the global. -->
  <script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/opening_hours@3.14.0/build/opening_hours.js"></script>
  <!-- Real Westchester venue data (generated by build_data.py) -->
  <script src="restaurants.js"></script>
  <!-- Real new openings from NY SLA pending licenses (generated by openings_feed.py) -->
  <script src="openings.js"></script>
  <!-- Researched briefings for openings (generated by briefings_research). Optional. -->
  <script src="briefings.js"></script>
  <!-- Hand-researched prospect overlay: 96 verified venues with contacts and human
       fit ratings, curated from the CT-Westchester prospecting spreadsheet. Optional. -->
  <script src="curated.js"></script>
  <!-- Cross-device sync (Supabase). Inert until sbconfig.js has real credentials. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="sbconfig.js"></script>
  <script src="sync.js"></script>

  <style>
    :root {
      --panel-bg: rgba(20, 24, 31, 0.92);
      --panel-fg: #e7ecf3;
      --accent: #ff7a45;
      --muted: #9aa6b6;
      --line: rgba(255, 255, 255, 0.12);
      --pulse: #ffffff;
    }
    body.light {
      --panel-bg: rgba(255, 255, 255, 0.94);
      --panel-fg: #1a2230;
      --accent: #e0611f;
      --muted: #5a6472;
      --line: rgba(0, 0, 0, 0.14);
      --pulse: #1a1a1a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { position: absolute; inset: 0; z-index: 0; }

    /* ---- Control panel ---- */
    .panel {
      position: absolute; top: 12px; left: 12px; z-index: 1000;
      width: 270px; max-width: calc(100vw - 24px);
      background: var(--panel-bg); color: var(--panel-fg);
      border: 1px solid var(--line); border-radius: 14px;
      padding: 14px 14px 12px; backdrop-filter: blur(8px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }
    .panel h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .2px; }
    .panel .sub { font-size: 11px; color: var(--muted); margin-bottom: 12px; }
    .panel .group { margin-bottom: 12px; }
    .panel .label { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 6px; }

    .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .mode {
      font-size: 12px; padding: 8px 6px; text-align: center; cursor: pointer;
      border: 1px solid var(--line); border-radius: 9px; background: transparent; color: var(--panel-fg);
      transition: all .12s ease;
    }
    .mode.active { background: var(--accent); border-color: var(--accent); color: #1a1005; font-weight: 600; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      font-size: 11px; padding: 5px 9px; cursor: pointer; user-select: none;
      border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted);
    }
    .chip.on { color: var(--panel-fg); border-color: var(--accent); background: rgba(255,122,69,.14); }

    .stat { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
    /* ---- Cross-device sync row ---- */
    .sync { font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
    .sync-row { display: flex; align-items: center; gap: 6px; }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
    .sync-in { flex: 1; min-width: 0; font-size: 11px; padding: 4px 6px; border-radius: 6px;
               border: 1px solid var(--line); background: transparent; color: var(--panel-fg); font-family: inherit; }
    .sync-btn { font-size: 11px; padding: 4px 8px; border-radius: 6px; cursor: pointer;
                border: 1px solid var(--line); background: transparent; color: var(--panel-fg); font-family: inherit; }
    .sync-btn:hover { border-color: var(--accent); }
    .sync-msg { margin-top: 4px; font-size: 10px; }
    .stat-warn { color: #ffb020; cursor: pointer; }
    .stat-warn:hover { text-decoration: underline; }
    .stat b { color: var(--panel-fg); }

    .toggle-pins { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--panel-fg); cursor: pointer; }
    .toggle-pins input { accent-color: var(--accent); }

    .legend { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
    .legend .bar { height: 8px; border-radius: 4px; margin: 4px 0 3px;
      background: linear-gradient(90deg,#2b6bff,#37d67a,#ffd93b,#ff7a45,#ff2d2d); }
    .legend .ends { display: flex; justify-content: space-between; }

    .leaflet-popup-content { font-size: 13px; line-height: 1.45; min-width: 180px; }
    .leaflet-popup-content .p-cat { color: #b06a3f; font-weight: 600; }
    .leaflet-popup-content .p-row { color: #444; }
    .pv-status { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 6px; }
    .pv-btn { font-size: 11px; padding: 3px 8px; border: 1px solid #ccc; border-radius: 6px; background: #f4f4f4; cursor: pointer; text-transform: capitalize; color: #333; }
    .pv-btn:hover { border-color: #999; }
    .pv-btn.sel { background: #111; color: #fff; border-color: #111; font-weight: 600; }
    .pv-note { width: 100%; min-height: 40px; font-size: 12px; border: 1px solid #ccc; border-radius: 6px; padding: 5px; resize: vertical; font-family: inherit; box-sizing: border-box; }
    /* ---- Hours + walk-in timing chart (popup) ---- */
    .bt { margin: 7px 0; padding: 7px 8px; background: #f7f8fa; border: 1px solid #e3e6ec; border-radius: 7px; font-size: 12px; }
    .bt-h { font-weight: 700; color: #46506a; margin-bottom: 3px; }
    .bt-hours { color: #444; margin-bottom: 5px; font-size: 11px; }
    .bt-unknown { color: #8a8a8a; font-style: italic; }
    .bt-days { display: flex; gap: 2px; margin-bottom: 3px; }
    .bt-day { flex: 1; font-size: 10px; padding: 2px 0; border: 1px solid #d8dce4; background: #fff; color: #666;
              border-radius: 4px; cursor: pointer; font-family: inherit; }
    .bt-day:hover { border-color: #9aa2b4; }
    .bt-day.sel { background: #46506a; border-color: #46506a; color: #fff; font-weight: 700; }
    .bt-svg { display: block; overflow: visible; margin: 2px 0 4px; }
    .bt-best { color: #0a7a0a; font-size: 11px; }
    .bt-best.bt-none { color: #8a8a8a; }
    .bt-avoid { color: #a33; font-size: 11px; }
    .bt-note { color: #9aa0ab; font-size: 10px; margin-top: 3px; font-style: italic; }

    .brief { margin: 7px 0; padding: 7px 8px; background: #fbf4ee; border: 1px solid #f0dccb; border-radius: 7px; font-size: 12px; line-height: 1.4; max-height: 200px; overflow-y: auto; }
    .brief-empty { color: #6b4a00; background: #fff6e0; border-color: #ffd489; }
    .brief-empty code { background: rgba(0,0,0,.06); padding: 0 3px; border-radius: 3px; }
    .brief-h { font-weight: 700; color: #b0561f; margin-bottom: 3px; }
    .brief-sum { margin-bottom: 4px; }
    .brief-spec { color: #999; font-weight: 400; font-style: italic; }
    .brief div { margin: 1px 0; }
    .brief-src { margin-top: 4px; border-top: 1px solid #eadfd2; padding-top: 3px; }
    .brief-cred { color: #888; font-size: 11px; }

    /* Curated-intel block: hand-researched prospects from the prospecting list. */
    .cur { margin: 7px 0; padding: 7px 8px; background: #eef4fb; border: 1px solid #cdddf2; border-radius: 7px; font-size: 12px; line-height: 1.4; }
    .cur-h { font-weight: 700; color: #2b5ea7; margin-bottom: 3px; }
    .cur div { margin: 1px 0; }
    .cur-approx { color: #8a8a8a; font-style: italic; margin-top: 3px; }

    /* collapse toggle for small screens */
    .collapse-btn { position: absolute; top: 10px; right: 10px; background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; }
    .panel.collapsed .group, .panel.collapsed .stat, .panel.collapsed .legend, .panel.collapsed .sub { display: none; }

    /* ---- New-opening alert toast ---- */
    #toastWrap { position: absolute; top: 12px; right: 12px; z-index: 1100; width: 260px; max-width: calc(100vw - 24px); }
    .toast {
      background: var(--panel-bg); color: var(--panel-fg); border: 1px solid var(--accent);
      border-left: 4px solid var(--accent); border-radius: 12px; padding: 11px 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.4); backdrop-filter: blur(8px);
      cursor: pointer; animation: slideIn .3s ease;
    }
    @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }
    .toast .t-tag { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--accent); font-weight: 700; }
    .toast .t-name { font-size: 14px; font-weight: 600; margin: 2px 0; }
    .toast .t-meta { font-size: 11px; color: var(--muted); }
    .toast .t-close { position: absolute; top: 6px; right: 9px; color: var(--muted); font-size: 14px; }
    .toast .t-dots { display: flex; gap: 4px; margin-top: 8px; }
    .toast .t-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
    .toast .t-dot.on { background: var(--accent); }

    /* ---- Pulsing marker for new openings (SVG path, zoom-stable) ---- */
    path.opening-pulse { animation: mkpulse 1.8s ease-out infinite; stroke: var(--pulse); }
    @keyframes mkpulse {
      0%   { stroke-width: 2;  stroke-opacity: .9; }
      70%  { stroke-width: 13; stroke-opacity: 0;  }
      100% { stroke-width: 13; stroke-opacity: 0;  }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="toastWrap"></div>

  <div class="panel" id="panel">
    <button class="collapse-btn" id="collapseBtn" title="Collapse">–</button>
    <button class="collapse-btn" id="themeBtn" title="Toggle light/dark" style="right: 34px;">☀</button>
    <h1>Prospect Heat Map</h1>
    <div class="sub" id="dataSub">Real venues · Chefs' Warehouse fit score · chains removed</div>

    <div class="group">
      <div class="label">Heat represents</div>
      <div class="modes" id="modes"></div>
    </div>

    <div class="group">
      <div class="label">Category</div>
      <div class="chips" id="catChips"></div>
    </div>

    <div class="group">
      <div class="label">Status</div>
      <div class="chips" id="statusChips"></div>
    </div>

    <div class="group">
      <div class="label">Hours</div>
      <div class="modes" id="hoursFilter" style="grid-template-columns: repeat(3, 1fr);">
        <button class="mode active" data-h="all">All</button>
        <button class="mode" data-h="open">Open now</button>
        <button class="mode" data-h="closed">Closed now</button>
      </div>
      <div style="font-size:10px; color:var(--muted); margin-top:5px;">Open/Closed cover only venues with known hours (~⅓).</div>
    </div>

    <div class="group">
      <div class="label">Min fit score: <span id="minFitVal">0</span></div>
      <input type="range" id="minFitSlider" min="0" max="98" value="0" step="1" style="width:100%; accent-color: var(--accent);" />
    </div>

    <div class="group">
      <label class="toggle-pins"><input type="checkbox" id="pinsToggle" checked /> Show pins</label>
      <label class="toggle-pins" style="margin-top:8px"><input type="checkbox" id="newOnlyToggle" /> 🆕 New openings only</label>
      <label class="toggle-pins" style="margin-top:8px"><input type="checkbox" id="needsBriefToggle" /> ⚠️ Needs research only</label>
      <label class="toggle-pins" style="margin-top:8px"><input type="checkbox" id="curatedToggle" /> 📋 Researched list only</label>
    </div>

    <div class="stat" id="stat"></div>

    <div class="sync" id="syncBox"></div>

    <div class="legend">
      <div class="bar"></div>
      <div class="ends"><span id="legLo">cold</span><span id="legHi">hot</span></div>
      <div style="margin-top:6px">⚪ new opening · <span style="color:#ffb020">◯ amber ring = needs research</span> · <span style="color:#2b5ea7">◯ blue ring = researched prospect</span></div>
    </div>
  </div>

  <script>
  // ============================================================
  //  CONFIG — change these when you go live
  // ============================================================
  const CONFIG = {
    // Center of your territory: Westchester County, NY (near White Plains).
    // Zoom pulled back to show surrounding areas (lower Hudson Valley, Sound Shore, CT border).
    center: [41.0500, -73.7700],
    zoom: 11,
    // Categories present in the real Westchester data ("Caterer" comes from the
    // curated overlay only — OSM doesn't tag caterers).
    categories: ["Restaurant", "Cafe", "Bar", "Bakery", "Caterer"],
  };

  // ============================================================
  //  HEAT MODES — each turns a prospect into a 0..1 weight.
  //  Add or edit modes freely.
  // ============================================================
  // Ranges filled in once PROSPECTS is built, so fit/pipeline stretch across the
  // full 0..1 heat range (otherwise dense point-count swamps the weighting).
  let FIT_MIN = 30, FIT_MAX = 98, VAL_MAX = 1;
  const norm = (v, lo, hi) => (hi > lo ? (v - lo) / (hi - lo) : 0.5);

  const MODES = {
    density:  { label: "Density",       weight: () => 1,                                              hint: ["few", "many"] },
    fit:      { label: "Fit score",     weight: p => 0.02 + 0.98 * Math.pow(norm(p.fitScore, FIT_MIN, FIT_MAX), 3), hint: ["poor fit", "great fit"] },
    pipeline: { label: "Pipeline $",    weight: p => 0.06 + 0.94 * norm(p.monthlyValue, 0, VAL_MAX),  hint: ["low $", "high $"] },
    coverage: { label: "Coverage gaps", weight: p => (p.status === "new" ? 1 : p.status === "contacted" ? 0.35 : 0.05), hint: ["worked", "untapped"] },
  };

  // ============================================================
  //  DATA — real Westchester venues from OpenStreetMap.
  //  Loaded from restaurants.js (window.REAL_RESTAURANTS).
  //  Real: name, category, cuisine, street, lat, lng.
  //  Placeholder until you prospect: status, fitScore, monthlyValue, opening.
  // ============================================================
  const STATUSES = ["new", "contacted", "customer", "not-interested"];
  // Existing venues (OSM) + real new openings (NY SLA pending licenses).
  const PROSPECTS = (window.REAL_RESTAURANTS || []).slice()
    .concat(window.REAL_OPENINGS || []);

  // Hand-researched overlay (curated.js, optional — the map works without it).
  //  - osmId matches a loaded venue -> upgrade it in place: the human rating
  //    replaces the fit.py heuristic and contact intel rides along. The OSM id
  //    is kept, so tracker status/notes already logged on that venue survive.
  //  - no osmId -> OSM simply doesn't have the venue (hotel dining rooms,
  //    bakeries and caterers are badly under-mapped) -> append as its own pin.
  (window.CURATED_PROSPECTS || []).forEach(c => {
    const host = c.osmId != null && PROSPECTS.find(p => p.id === c.osmId);
    if (host) {
      Object.assign(host, { fitScore: c.fitScore, myRating: c.myRating, phone: c.phone,
        contact: c.contact, segment: c.segment, whyFit: c.whyFit, town: c.town,
        state: c.state, curated: true });
    } else if (c.lat != null) {
      PROSPECTS.push(Object.assign({}, c));
    }
  });

  // Fill in the metric ranges used by the fit/pipeline heat modes.
  if (PROSPECTS.length) {
    FIT_MIN = Math.min(...PROSPECTS.map(p => p.fitScore));
    FIT_MAX = Math.max(...PROSPECTS.map(p => p.fitScore));
    VAL_MAX = Math.max(...PROSPECTS.map(p => p.monthlyValue)) || 1;
  }

  // If sync.js or the Supabase CDN is unreachable, the map must still work —
  // it did fine on localStorage alone for months. Stub out the same surface.
  window.Sync = window.Sync || {
    configured: false, status: "off", user: null, error: null, onChange() {},
    init() {}, push() {}, pending() { return 0; },
    signIn() { return { error: "sync unavailable" }; }, signOut() {},
  };

  // ---- Visit tracker: saved on this device (localStorage) ----
  const STORE_KEY = "prospectTracker.v1";
  function loadStore() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; } }
  function saveStore() { localStorage.setItem(STORE_KEY, JSON.stringify(tracker)); }
  const tracker = loadStore();

  // Index prospects by string id, and overlay any saved status/notes.
  const BY_ID = {};
  PROSPECTS.forEach(p => {
    const key = String(p.id);
    BY_ID[key] = p;
    const t = tracker[key];
    if (t) { if (t.status) p.status = t.status; if (t.note) p.note = t.note; }
  });

  function setStatus(id, s) {
    const p = BY_ID[id]; if (!p) return;
    p.status = s;
    tracker[id] = Object.assign({}, tracker[id], { status: s, updated: Date.now() });
    saveStore(); Sync.push(id, tracker[id]); render();
  }
  function setNote(id, note) {
    const p = BY_ID[id]; if (p) p.note = note;
    tracker[id] = Object.assign({}, tracker[id], { note: note, updated: Date.now() });
    saveStore(); Sync.push(id, tracker[id]);
  }

  // ---- Hooks the sync layer calls to read/replace the tracker --------------
  window.TRACKER_SNAPSHOT = () => JSON.parse(JSON.stringify(tracker));
  window.TRACKER_APPLY = merged => {
    Object.keys(tracker).forEach(k => delete tracker[k]);
    Object.assign(tracker, merged);
    // Re-overlay onto the live prospects: a venue dropped from the merge goes
    // back to its default state, so a delete on another device propagates.
    PROSPECTS.forEach(p => {
      const t = tracker[String(p.id)];
      p.status = (t && t.status) || "new";
      p.note = (t && t.note) || "";
    });
    saveStore(); render();
  };

  // Human-readable label for a new-opening flag.
  function openingLabel(o) {
    if (!o) return "";
    if (o.type === "soon") return "Opening soon";
    return "Recently opened";
  }
  // ---- Open-now evaluation from OSM opening_hours (parsed once, cached) ----
  const OH_CACHE = {};
  // If the parser fails to load, every hours feature degrades to "unknown" —
  // which looks like missing data rather than a broken dependency. Say so loudly.
  const OH_OK = typeof opening_hours !== "undefined";
  if (!OH_OK) console.error(
    "[heatmap] opening_hours failed to load — Open/Closed filters and posted-hours " +
    "clipping are disabled; walk-in charts fall back to typical hours for the category.");
  function isOpenNow(hours) {
    if (!hours || !OH_OK) return null;        // unknown
    if (OH_CACHE[hours] === "err") return null;
    try {
      let oh = OH_CACHE[hours];
      if (!oh) {
        oh = new opening_hours(hours, { lat: CONFIG.center[0], lon: CONFIG.center[1],
          address: { country_code: "us", state: "New York" } });
        OH_CACHE[hours] = oh;
      }
      return oh.getState(new Date());        // true = open, false = closed
    } catch (e) { OH_CACHE[hours] = "err"; return null; }
  }

  // ============================================================
  //  WHEN TO WALK IN — modeled hourly busyness
  //
  //  Google's Popular Times is not exposed by any free API and scraping it
  //  breaks their ToS, so these curves are MODELED, not observed: a typical
  //  service pattern for the venue's category + cuisine, shifted by day of
  //  week and clipped to real OSM opening hours where we have them. Labeled
  //  as an estimate everywhere it's shown.
  //
  //  For a rep the useful read is inverted from Google's: a tall bar is a
  //  BAD time to walk in — the kitchen is slammed and the owner won't talk.
  // ============================================================

  // Base curves, hour 0-23, relative 0..1. Peaks reflect meal periods.
  const DAYPART = {
    Restaurant: [0,0,0,0,0,0,0,.02,.05,.08,.12,.35,.72,.68,.38,.22,.28,.50,.80,1.0,.92,.62,.35,.15],
    Cafe:       [0,0,0,0,0,.05,.15,.60,.95,1.0,.80,.62,.60,.50,.40,.35,.28,.20,.12,.08,.05,.02,0,0],
    Bakery:     [0,0,0,0,0,.10,.30,.75,1.0,.95,.80,.62,.55,.42,.30,.22,.15,.10,.05,.02,0,0,0,0],
    Bar:        [.60,.40,.15,.05,0,0,0,0,0,0,0,.05,.15,.18,.15,.10,.20,.42,.60,.72,.85,1.0,.95,.80],
  };

  // Cuisine nudges: [startHour, endHour, multiplier]
  const CUISINE_SHIFT = [
    [/pizza|pizzeria/i,            [[17,23, 1.25]]],                 // dinner + late
    [/diner|breakfast|bagel/i,     [[6,11, 1.6], [18,23, 0.7]]],     // morning-led
    [/deli|sandwich|sub|salad/i,   [[11,14, 1.5], [17,22, 0.5]]],    // lunch-only
    [/coffee|tea|juice/i,          [[6,10, 1.4], [15,23, 0.6]]],
    [/bar|pub|tavern|brewery/i,    [[19,23, 1.3]]],
    [/sushi|japanese|steak|french|italian/i, [[18,21, 1.2], [11,14, 0.85]]], // dinner house
  ];

  // Day-of-week: 0=Sun … 6=Sat. Weekend brunch, Friday/Saturday night lift.
  function dayShift(prof, dow) {
    const out = prof.slice();
    const scale = [0.92, 0.85, 0.92, 0.96, 1.0, 1.15, 1.18][dow];   // Mon quietest
    for (let h = 0; h < 24; h++) out[h] *= scale;
    if (dow === 0 || dow === 6) {                                    // brunch
      for (let h = 10; h <= 13; h++) out[h] = Math.min(1, out[h] * 1.45);
      for (let h = 6; h <= 8; h++) out[h] *= 0.7;                    // nobody's early
    }
    if (dow === 5 || dow === 6) for (let h = 21; h <= 23; h++) out[h] = Math.min(1, out[h] * 1.3);
    return out;
  }

  // Is this venue open at hour h on weekday dow? true/false/null(unknown).
  function openAtHour(hours, dow, h) {
    if (!hours || !OH_OK) return null;
    if (OH_CACHE[hours] === "err") return null;
    try {
      let oh = OH_CACHE[hours];
      if (!oh) {
        oh = new opening_hours(hours, { lat: CONFIG.center[0], lon: CONFIG.center[1],
          address: { country_code: "us", state: "New York" } });
        OH_CACHE[hours] = oh;
      }
      const d = new Date();                        // this week's instance of `dow`
      d.setDate(d.getDate() + ((dow - d.getDay() + 7) % 7));
      d.setHours(h, 30, 0, 0);                     // mid-hour probe
      return oh.getState(d);
    } catch (e) { OH_CACHE[hours] = "err"; return null; }
  }

  // Real foot-traffic overrides, keyed by venue id, filled in asynchronously by
  // the backend. Absent = fall back to the model, which is the normal case.
  const REAL_TRAFFIC = {};

  // Modeled busyness for a venue on a given weekday -> {busy[24], open[24]}
  function busyProfile(p, dow) {
    const real = REAL_TRAFFIC[String(p.id)];
    if (real && real[dow]) {
      const busy = [], open = [];
      for (let h = 0; h < 24; h++) {
        const o = openAtHour(p.hours, dow, h);
        // With real data, "open" is inferred from traffic when hours are unknown.
        const isOpen = o === null ? real[dow][h] > 0 : o;
        open.push(isOpen);
        busy.push(isOpen ? real[dow][h] : 0);
      }
      return { busy, open, known: true, real: true };
    }
    let prof = (DAYPART[p.category] || DAYPART.Restaurant).slice();
    const text = `${p.name} ${p.cuisine || ""}`;
    CUISINE_SHIFT.forEach(([re, spans]) => {
      if (!re.test(text)) return;
      spans.forEach(([a, b, m]) => { for (let h = a; h <= b && h < 24; h++) prof[h] = Math.min(1, prof[h] * m); });
    });
    prof = dayShift(prof, dow);

    const open = [], busy = [];
    for (let h = 0; h < 24; h++) {
      const o = openAtHour(p.hours, dow, h);
      // Unknown hours: fall back to "open wherever the curve says there's trade".
      const isOpen = o === null ? prof[h] > 0.03 : o;
      open.push(isOpen);
      busy.push(isOpen ? prof[h] : 0);
    }
    return { busy, open, known: !!p.hours && openAtHour(p.hours, dow, 12) !== null };
  }

  const hLabel = h => (h % 12 === 0 ? 12 : h % 12) + (h < 12 ? "am" : "pm");
  const hShort = h => (h % 12 === 0 ? 12 : h % 12) + (h < 12 ? "a" : "p");

  // Contiguous runs of hours passing `ok`, as [start,end] inclusive.
  function runs(arr, ok) {
    const out = []; let s = null;
    for (let h = 0; h < 24; h++) {
      if (ok(arr[h], h)) { if (s === null) s = h; }
      else { if (s !== null) out.push([s, h - 1]); s = null; }
    }
    if (s !== null) out.push([s, 23]);
    return out;
  }

  const QUIET = 0.34, SLAMMED = 0.60;

  // Best window to walk in: open, quiet, and long enough to be worth the drive.
  // Mid-afternoon between services is the classic one; late morning during prep
  // is the runner-up (chef's in, deliveries are landing).
  function walkInAdvice(p, dow) {
    const { busy, open } = busyProfile(p, dow);
    // Callable hours only: nobody sells at 7am or 9pm, even if the room is empty.
    const CALL0 = 9, CALL1 = 19;
    const raw = runs(busy, (v, h) => open[h] && v > 0 && v <= QUIET);
    const quiet = raw
      .map(([a, b]) => [Math.max(a, CALL0), Math.min(b, CALL1)])
      .filter(([a, b]) => b - a >= 1);                 // at least 2 hours wide
    const score = ([a, b]) => {
      let s = (b - a + 1);                             // longer is better
      if (a <= 16 && b >= 14) s += 4;                  // overlaps the 2–4pm lull
      if (a <= 11 && b >= 9) s += 3;                   // late-morning prep & deliveries
      return s;
    };
    quiet.sort((x, y) => score(y) - score(x));
    const best = quiet[0] || null;
    const avoid = runs(busy, (v, h) => open[h] && v >= SLAMMED);
    const fmt = ([a, b]) => `${hLabel(a)}–${hLabel(b + 1 > 23 ? 0 : b + 1)}`;
    return { best, bestText: best ? fmt(best) : null, avoid: avoid.map(fmt) };
  }

  const BRIEFINGS = window.OPENING_BRIEFINGS || {};
  const BRIEF_ALIASES = window.BRIEFING_ALIASES || {};

  // Same normalization as build_briefings.py, so the alias keys line up.
  function normAddr(s) {
    return (s || "").toLowerCase()
      .replace(/[^a-z0-9 ]+/g, " ")
      .replace(/\b(street|st|avenue|ave|road|rd|drive|dr|lane|ln|place|pl|boulevard|blvd|suite|ste|unit|north|south|east|west|n|s|e|w)\b/g, " ")
      .replace(/\s+/g, " ").trim();
  }

  // Resolve a briefing for a venue. A venue's SLA id changes when its license
  // goes pending -> active, so fall back to matching on name+address, then on
  // an unambiguous address alone (flagged, since the licensee name differs).
  function findBriefing(p) {
    const direct = BRIEFINGS[String(p.id)];
    if (direct) return { b: direct, exact: true };
    const street = normAddr(p.street);
    const a = BRIEF_ALIASES[normAddr(p.name) + "|" + street] || BRIEF_ALIASES[street];
    if (a && BRIEFINGS[a.id]) return { b: BRIEFINGS[a.id], exact: a.exact };
    return null;
  }

  // ---- Hours + "when to walk in" popup section ------------------------------
  // Bar HEIGHT is the estimate (busyness); the recommended window is marked by
  // color AND named in text below, never by color alone — green/red status
  // coding fails deuteranope separation, so the text label carries the meaning.
  const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const H0 = 6, H1 = 23;                      // hours drawn (6am–11pm)

  function busyChartSvg(p, dow) {
    const { busy, open } = busyProfile(p, dow);
    const adv = walkInAdvice(p, dow);
    const n = H1 - H0 + 1, W = 244, H = 58, gap = 2;
    const bw = W / n - gap;
    const now = new Date();
    const isToday = now.getDay() === dow;

    let bars = "", ticks = "", nowMark = "";
    for (let i = 0; i < n; i++) {
      const h = H0 + i, x = i * (W / n), v = busy[h];
      const inBest = adv.best && h >= adv.best[0] && h <= adv.best[1];
      if (!open[h]) {
        bars += `<rect x="${x.toFixed(1)}" y="${H - 2}" width="${bw.toFixed(1)}" height="2" rx="1" fill="#e6e6e6"><title>${hLabel(h)} · closed</title></rect>`;
      } else {
        const bh = Math.max(3, v * (H - 4));
        const state = v >= SLAMMED ? "slammed" : v <= QUIET ? "quiet" : "steady";
        bars += `<rect x="${x.toFixed(1)}" y="${(H - bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" ` +
          `fill="${inBest ? "#0ca30c" : "#f3b995"}"><title>${hLabel(h)} · ${state}${inBest ? " · best time to walk in" : ""}</title></rect>`;
      }
      if (h % 3 === 0) ticks += `<text x="${(x + bw / 2).toFixed(1)}" y="${H + 10}" text-anchor="middle" font-size="8" fill="#8a8a8a">${hShort(h)}</text>`;
      if (isToday && h === now.getHours())
        nowMark = `<rect x="${(x - 1).toFixed(1)}" y="0" width="${(bw + 2).toFixed(1)}" height="${H}" fill="none" stroke="#333" stroke-width="1" rx="3"/>` +
                  `<text x="${(x + bw / 2).toFixed(1)}" y="-2" text-anchor="middle" font-size="8" fill="#333" font-weight="700">now</text>`;
    }
    return `<svg class="bt-svg" viewBox="-2 -10 ${W + 4} ${H + 16}" width="100%" role="img" ` +
      `aria-label="Estimated busyness by hour on ${DAY_NAMES[dow]}">${bars}${ticks}${nowMark}</svg>`;
  }

  // Everything that changes when you pick a different day. Kept separate so the
  // day tabs can redraw it without replacing the listener-bearing wrapper.
  function btBody(p, dow) {
    const adv = walkInAdvice(p, dow);
    const { known } = busyProfile(p, dow);
    const tabs = DAY_NAMES.map((d, i) =>
      `<button class="bt-day ${i === dow ? "sel" : ""}" data-dow="${i}" title="${d}">${d[0]}</button>`).join("");
    return `<div class="bt-days">${tabs}</div>` +
      busyChartSvg(p, dow) +
      (adv.bestText
        ? `<div class="bt-best">✓ Best walk-in: <b>${adv.bestText}</b> — quiet, between services</div>`
        : `<div class="bt-best bt-none">No clear lull ${DAY_NAMES[dow]} — try another day</div>`) +
      (adv.avoid.length ? `<div class="bt-avoid">✕ Avoid: ${adv.avoid.join(", ")} (slammed)</div>` : "") +
      (REAL_TRAFFIC[String(p.id)]
        ? `<div class="bt-note bt-real">Real foot-traffic forecast (BestTime).</div>`
        : `<div class="bt-note">Estimated from venue type${known ? " + posted hours" : ""}, not observed foot traffic.</div>`);
  }

  function bestTimeHtml(p, dow) {
    const st = isOpenNow(p.hours);
    const hoursLine = p.hours
      ? `<div class="bt-hours">${st === true ? "🟢 Open now" : st === false ? "🔴 Closed now" : "Hours"} · ${p.hours}</div>`
      : `<div class="bt-hours bt-unknown">Hours not on record — pattern below is typical for a ${p.category.toLowerCase()}</div>`;
    return `<div class="bt">` +
      `<div class="bt-h">🕐 Hours &amp; when to walk in</div>` +
      hoursLine +
      `<div class="bt-body">${btBody(p, dow)}</div>` +
      `</div>`;
  }

  // An opening with no briefing is a research to-do, surfaced in the UI.
  function needsBriefing(p) { return !!p.opening && !findBriefing(p); }

  // Intel block for hand-researched prospects (curated overlay). The 1-5 rating
  // is a human call from menus/press/ownership, not the fit.py heuristic.
  function curatedHtml(p) {
    if (!p.curated) return "";
    const tel = p.phone ? `<a href="tel:${p.phone.replace(/[^0-9+]/g, "")}">${p.phone}</a>` : "";
    return `<div class="cur"><div class="cur-h">📋 Researched prospect · rating ${p.myRating}/5</div>` +
      (p.segment ? `<div><b>Segment:</b> ${p.segment}</div>` : "") +
      (tel ? `<div><b>Phone:</b> ${tel}</div>` : "") +
      (p.contact ? `<div><b>Contact:</b> ${p.contact}</div>` : "") +
      (p.whyFit ? `<div><b>Why:</b> ${p.whyFit}</div>` : "") +
      (p.approxLoc ? `<div class="cur-approx">Pin location is approximate (town-level).</div>` : "") +
      `</div>`;
  }

  // Build the researched-briefing block for an opening popup (or a placeholder).
  function briefingHtml(p) {
    const hit = findBriefing(p);
    if (!hit) return `<div class="brief brief-empty">⚠️ <b>Needs research</b> — no briefing for this one yet. Research it, then add it to <code>.briefsrc/</code> and rerun <code>build_briefings.py</code>.</div>`;
    const b = hit.b;
    const conf = b.confidence != null ? b.confidence : "?";
    const spec = b.speculative ? ` <span class="brief-spec">(informed guess)</span>` : "";
    const inherited = hit.exact ? "" : ` <span class="brief-spec">(matched by address — licensee name has changed)</span>`;
    let h = `<div class="brief"><div class="brief-h">🔎 Briefing · confidence ${conf}/10${spec}${inherited}</div>`;
    if (b.summary) h += `<div class="brief-sum">${b.summary}</div>`;
    if (b.style) h += `<div><b>Style:</b> ${b.style}</div>`;
    if (b.menu) h += `<div><b>Menu:</b> ${b.menu}</div>`;
    if (b.cwSellers && b.cwSellers.length) h += `<div><b>Top products to sell them:</b> ${b.cwSellers.join(", ")}</div>`;
    if (b.angle) h += `<div><b>Pitch angle:</b> ${b.angle}</div>`;
    if (b.sources && b.sources.length) {
      h += `<div class="brief-src"><b>Sources:</b>` +
        b.sources.map(s => `<div>· <a href="${s.url}" target="_blank" rel="noopener">${s.label}</a> <span class="brief-cred">${s.cred}/10</span></div>`).join("") +
        `</div>`;
    }
    return h + `</div>`;
  }

  // Secondary detail line for openings (SLA stage / dates).
  function openingDetail(o) {
    if (!o) return "";
    if (o.type === "open") return `Licensed ${o.issued || "recently"}`;
    if (o.stage) return `Liquor license: ${o.stage}` + (o.received ? ` · filed ${o.received}` : "");
    if (o.received) return `Filed ${o.received}`;
    return o.source || "";
  }

  // ============================================================
  //  MAP
  // ============================================================
  const map = L.map("map", { zoomControl: true }).setView(CONFIG.center, CONFIG.zoom);

  // Theme-aware basemap (dark/light), remembered on this device.
  const TILE = {
    dark: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
    light: "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
  };
  let theme = localStorage.getItem("prospectTheme") || "dark";
  if (theme === "light") document.body.classList.add("light");
  let baseLayer = L.tileLayer(TILE[theme], { attribution: "&copy; OpenStreetMap &copy; CARTO", maxZoom: 20 }).addTo(map);

  function setTheme(t) {
    theme = t;
    document.body.classList.toggle("light", t === "light");
    map.removeLayer(baseLayer);
    baseLayer = L.tileLayer(TILE[t], { attribution: "&copy; OpenStreetMap &copy; CARTO", maxZoom: 20 }).addTo(map);
    localStorage.setItem("prospectTheme", t);
    const btn = document.getElementById("themeBtn");
    if (btn) btn.textContent = t === "light" ? "☾" : "☀";
    render();
  }

  let heatLayer = null;
  const markerLayer = L.layerGroup().addTo(map);

  // ============================================================
  //  STATE + UI
  // ============================================================
  const state = {
    mode: "density",
    cats: new Set(CONFIG.categories),
    statuses: new Set(STATUSES),
    showPins: true,
    newOnly: false,
    needsBrief: false,
    curatedOnly: false,
    minFit: 0,
    openNow: "all",
  };

  const STATUS_COLOR = { new: "#ff7a45", contacted: "#ffd93b", customer: "#37d67a", "not-interested": "#7a8290" };

  // Build mode buttons
  const modesEl = document.getElementById("modes");
  Object.entries(MODES).forEach(([key, m]) => {
    const b = document.createElement("button");
    b.className = "mode" + (key === state.mode ? " active" : "");
    b.textContent = m.label;
    b.onclick = () => { state.mode = key; document.querySelectorAll(".mode").forEach(x => x.classList.remove("active")); b.classList.add("active"); render(); };
    modesEl.appendChild(b);
  });

  // Build category chips
  const catEl = document.getElementById("catChips");
  CONFIG.categories.forEach(c => {
    const chip = document.createElement("div");
    chip.className = "chip on"; chip.textContent = c;
    chip.onclick = () => { toggleSet(state.cats, c); chip.classList.toggle("on"); render(); };
    catEl.appendChild(chip);
  });

  // Build status chips
  const statEl = document.getElementById("statusChips");
  STATUSES.forEach(s => {
    const chip = document.createElement("div");
    chip.className = "chip on"; chip.textContent = s;
    chip.onclick = () => { toggleSet(state.statuses, s); chip.classList.toggle("on"); render(); };
    statEl.appendChild(chip);
  });

  document.getElementById("pinsToggle").onchange = e => { state.showPins = e.target.checked; render(); };
  document.getElementById("newOnlyToggle").onchange = e => { state.newOnly = e.target.checked; render(); };
  document.getElementById("needsBriefToggle").onchange = e => { state.needsBrief = e.target.checked; render(); };
  document.getElementById("curatedToggle").onchange = e => { state.curatedOnly = e.target.checked; render(); };
  document.getElementById("minFitSlider").oninput = e => {
    state.minFit = +e.target.value;
    document.getElementById("minFitVal").textContent = state.minFit;
    render();
  };
  document.querySelectorAll("#hoursFilter .mode").forEach(b => b.onclick = () => {
    state.openNow = b.getAttribute("data-h");
    document.querySelectorAll("#hoursFilter .mode").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  });
  document.getElementById("collapseBtn").onclick = () => document.getElementById("panel").classList.toggle("collapsed");
  document.getElementById("themeBtn").onclick = () => setTheme(theme === "light" ? "dark" : "light");
  document.getElementById("themeBtn").textContent = theme === "light" ? "☾" : "☀";

  function toggleSet(set, v) { set.has(v) ? set.delete(v) : set.add(v); }

  // ============================================================
  //  RENDER
  // ============================================================
  function visibleProspects() {
    return PROSPECTS.filter(p => {
      if (!state.cats.has(p.category)) return false;
      if (!state.statuses.has(p.status)) return false;
      if (p.fitScore < state.minFit) return false;
      if (state.newOnly && !p.opening) return false;
      if (state.needsBrief && !needsBriefing(p)) return false;
      if (state.curatedOnly && !p.curated) return false;
      if (state.openNow !== "all") {
        const st = isOpenNow(p.hours);       // true / false / null(unknown)
        if (state.openNow === "open" && st !== true) return false;
        if (state.openNow === "closed" && st !== false) return false;
      }
      return true;
    });
  }

  function render() {
    const shown = visibleProspects();
    const mode = MODES[state.mode];
    const light = document.body.classList.contains("light");
    const openFill = light ? "#1a1a1a" : "#ffffff";
    const openStroke = light ? "#ffffff" : "#1a1a1a";

    // Heat layer
    const points = shown.map(p => [p.lat, p.lng, Math.max(mode.weight(p), 0.05)]);
    if (heatLayer) map.removeLayer(heatLayer);
    heatLayer = L.heatLayer(points, {
      radius: 22, blur: 17, maxZoom: 17, minOpacity: 0.3, max: 4.5,
      gradient: { 0.0: "#2b6bff", 0.35: "#37d67a", 0.6: "#ffd93b", 0.8: "#ff7a45", 1.0: "#ff2d2d" },
    }).addTo(map);

    // Pins
    markerLayer.clearLayers();
    if (state.showPins) {
      shown.forEach(p => {
        const cuisineBit = p.cuisine ? ` · ${p.cuisine}` : "";
        const streetBit = p.street ? `<span class="p-row">${p.street}</span><br>` : "";
        const hoursBit = bestTimeHtml(p, new Date().getDay());
        const statusBtns = STATUSES.map(s =>
          `<button class="pv-btn ${p.status === s ? "sel" : ""}" data-status="${s}">${s.replace("-", " ")}</button>`).join("");
        const popupHtml =
          `<div class="pv" data-id="${String(p.id)}">` +
          `<b>${p.name}</b><br>` +
          (p.opening ? `<span style="color:#c94a1e;font-weight:600">🆕 ${openingLabel(p.opening)}</span><br><span class="p-row">${openingDetail(p.opening)}</span><br>` + briefingHtml(p) : "") +
          `<span class="p-cat">${p.category}${cuisineBit}</span><br>` +
          streetBit +
          curatedHtml(p) +
          hoursBit +
          `<span class="p-row">${p.curated
            ? `Fit ${p.fitScore}/100 — from the researched ${p.myRating}/5 rating`
            : `Est. fit ${p.fitScore}/100 · ~$${p.monthlyValue}/mo`}</span>` +
          `<div class="pv-status">${statusBtns}</div>` +
          `<textarea class="pv-note" placeholder="Notes (saved automatically)…">${p.note || ""}</textarea>` +
          `</div>`;

        let marker;
        if (p.opening) {
          // Openings are white circleMarkers (SVG, zoom-stable). "Opening soon"
          // pulses (still coming); "just opened" is a static white dot.
          if (p.opening.type === "soon") {
            L.circleMarker([p.lat, p.lng], {
              radius: 6, color: "#ffffff", weight: 2, fill: false, className: "opening-pulse", interactive: false,
            }).addTo(markerLayer);
          }
          // Unbriefed openings get an amber ring — a visible "research me".
          const bare = needsBriefing(p);
          marker = L.circleMarker([p.lat, p.lng], {
            radius: 6, color: bare ? "#ffb020" : openStroke, weight: bare ? 3 : 1.5,
            fillColor: openFill, fillOpacity: 1,
          });
        } else {
          // Researched prospects get a heavier blue ring (plus the 📋 popup
          // block — the ring never carries the meaning alone).
          marker = L.circleMarker([p.lat, p.lng], {
            radius: p.curated ? 6 : 5, color: p.curated ? "#2b5ea7" : "#000",
            weight: p.curated ? 2 : 1, fillColor: STATUS_COLOR[p.status], fillOpacity: 0.9,
          });
        }
        marker.bindPopup(popupHtml).addTo(markerLayer);
      });
    }

    // Stats
    const totalVal = shown.reduce((a, p) => a + p.monthlyValue, 0);
    const contacted = PROSPECTS.filter(p => p.status === "contacted").length;
    const customers = PROSPECTS.filter(p => p.status === "customer").length;
    const unbriefed = PROSPECTS.filter(needsBriefing).length;
    document.getElementById("stat").innerHTML =
      `<b>${shown.length}</b> shown · <b>$${totalVal.toLocaleString()}</b>/mo potential<br>` +
      `<b>${contacted}</b> contacted · <b>${customers}</b> customers` +
      (unbriefed ? `<br><span class="stat-warn" id="statWarn">⚠️ <b>${unbriefed}</b> opening${unbriefed === 1 ? "" : "s"} need research</span>` : "");
    const warn = document.getElementById("statWarn");
    if (warn) warn.onclick = () => {                      // jump straight to them
      const cb = document.getElementById("needsBriefToggle");
      cb.checked = true; state.needsBrief = true; render();
    };

    // Legend labels reflect current mode
    document.getElementById("legLo").textContent = mode.hint[0];
    document.getElementById("legHi").textContent = mode.hint[1];
  }

  // ============================================================
  //  SYNC UI — a status dot plus magic-link sign-in.
  //  Hidden entirely when sbconfig.js has no credentials, so the map looks and
  //  behaves exactly as before until a backend actually exists.
  // ============================================================
  const SYNC_UI = {
    off:          { dot: "transparent", text: "" },
    "signed-out": { dot: "#9aa6b6", text: "Saved on this device only" },
    syncing:      { dot: "#ffb020", text: "Syncing…" },
    ok:           { dot: "#0ca30c", text: "Synced across devices" },
    error:        { dot: "#d03b3b", text: "Sync problem — still saving locally" },
  };

  function renderSync() {
    const box = document.getElementById("syncBox");
    if (!Sync.configured) { box.innerHTML = ""; return; }
    const ui = SYNC_UI[Sync.status] || SYNC_UI["signed-out"];
    const pending = Sync.pending();

    let body;
    if (Sync.user) {
      body = `<div class="sync-row"><span class="sync-dot" style="background:${ui.dot}"></span>` +
             `<span style="flex:1;overflow:hidden;text-overflow:ellipsis">${ui.text}${pending ? ` · ${pending} queued` : ""}</span>` +
             `<button class="sync-btn" id="syncOut">Sign out</button></div>` +
             (Sync.error ? `<div class="sync-msg" style="color:#e08">${Sync.error}</div>` : "");
    } else {
      body = `<div class="sync-row"><span class="sync-dot" style="background:${ui.dot}"></span>` +
             `<span>${ui.text}</span></div>` +
             `<div class="sync-row" style="margin-top:5px">` +
             `<input class="sync-in" id="syncEmail" type="email" placeholder="you@email.com" autocomplete="email" />` +
             `<button class="sync-btn" id="syncIn">Sync</button></div>` +
             `<div class="sync-msg" id="syncMsg"></div>`;
    }
    box.innerHTML = body;

    const out = document.getElementById("syncOut");
    if (out) out.onclick = () => Sync.signOut();
    const inBtn = document.getElementById("syncIn");
    if (inBtn) inBtn.onclick = async () => {
      const email = document.getElementById("syncEmail").value.trim();
      const msg = document.getElementById("syncMsg");
      if (!email) { msg.textContent = "Enter your email first."; return; }
      msg.textContent = "Sending link…";
      const { error } = await Sync.signIn(email);
      msg.style.color = error ? "#e08" : "#0ca30c";
      msg.textContent = error ? error : "Check your email for the sign-in link.";
    };
  }

  Sync.onChange = renderSync;
  renderSync();
  Sync.init().then(async () => {
    // Swap in the backend openings feed if it has data. Bundled openings.js
    // already rendered, so this is a silent top-up, not a blocking load.
    const fresh = await Sync.fetchOpenings();
    if (!fresh) return;
    const keep = PROSPECTS.filter(p => !p.opening);
    const byId = {};
    fresh.forEach(o => { byId[String(o.id)] = o; });
    // Preserve tracker state that's already been overlaid onto these venues.
    fresh.forEach(o => {
      const t = tracker[String(o.id)];
      if (t) { if (t.status) o.status = t.status; if (t.note) o.note = t.note; }
    });
    PROSPECTS.length = 0;
    PROSPECTS.push(...keep, ...fresh);
    Object.keys(BY_ID).forEach(k => { if (BY_ID[k].opening) delete BY_ID[k]; });
    fresh.forEach(o => { BY_ID[String(o.id)] = o; });
    render();
  });

  // ============================================================
  //  NEW-OPENING AUTO ALERT (rotating toast, top-right)
  //  Soonest/most-recent openings first. Click to fly there.
  //  In production this list is fed by the live openings feed;
  //  a new arrival re-triggers showToast().
  // ============================================================
  const STAGE_RANK = { "Conditionally Approved": 3, "Under Review": 2, "IntakeComplete": 1, "Reconsideration": 1 };
  const openings = PROSPECTS
    .filter(p => p.opening)
    .sort((a, b) => (STAGE_RANK[b.opening.stage] || 0) - (STAGE_RANK[a.opening.stage] || 0)); // closest-to-open first

  let toastIdx = 0, toastTimer = null;

  function showToast() {
    const wrap = document.getElementById("toastWrap");
    if (!openings.length) { wrap.innerHTML = ""; return; }
    const p = openings[toastIdx % openings.length];
    const tag = openingLabel(p.opening);
    const dots = openings.map((_, i) => `<span class="t-dot ${i === toastIdx % openings.length ? "on" : ""}"></span>`).join("");

    wrap.innerHTML =
      `<div class="toast" id="toast">
         <span class="t-close" id="toastClose">✕</span>
         <div class="t-tag">🆕 ${tag} · ${p.category}</div>
         <div class="t-name">${p.name}</div>
         <div class="t-meta">${openingDetail(p.opening)} · tap to locate</div>
         <div class="t-dots">${dots}</div>
       </div>`;

    document.getElementById("toast").onclick = () => {
      map.flyTo([p.lat, p.lng], 15, { duration: 0.8 });
      markerLayer.eachLayer(l => { if (l.getLatLng && Math.abs(l.getLatLng().lat - p.lat) < 1e-6) l.openPopup(); });
    };
    document.getElementById("toastClose").onclick = e => { e.stopPropagation(); clearInterval(toastTimer); wrap.innerHTML = ""; };
  }

  function startToastRotation() {
    if (!openings.length) return;
    showToast();
    toastTimer = setInterval(() => { toastIdx++; showToast(); }, 5000); // cycle every 5s
  }

  // Wire up the tracker controls whenever a popup opens.
  map.on("popupopen", e => {
    const node = e.popup.getElement();
    const wrap = node && node.querySelector(".pv");
    if (!wrap) return;
    const id = wrap.getAttribute("data-id");
    wrap.querySelectorAll(".pv-btn").forEach(b =>
      b.addEventListener("click", () => setStatus(id, b.getAttribute("data-status"))));
    // Day tabs on the walk-in chart: redraw in place, keep the popup open.
    // Ask the backend for a real forecast for this venue. Cached server-side and
    // in REAL_TRAFFIC, so opening the same popup twice costs nothing.
    const pv = BY_ID[id];
    if (pv && Sync.configured && !(String(pv.id) in REAL_TRAFFIC)) {
      Sync.footTraffic(pv).then(days => {
        REAL_TRAFFIC[String(pv.id)] = days || null;
        const body = wrap.querySelector(".bt-body");
        if (days && body) body.innerHTML = btBody(pv, +wrap.querySelector(".bt-day.sel").getAttribute("data-dow"));
      });
    }

    // Day tabs on the walk-in chart: redraw the body in place, keep popup open.
    const bt = wrap.querySelector(".bt");
    if (bt) bt.addEventListener("click", ev => {
      const d = ev.target.closest(".bt-day");
      if (!d) return;
      ev.preventDefault();
      ev.stopPropagation();                      // don't let the map close the popup
      const p = BY_ID[id]; if (!p) return;
      bt.querySelector(".bt-body").innerHTML = btBody(p, +d.getAttribute("data-dow"));
    });
    const ta = wrap.querySelector(".pv-note");
    if (ta) ta.addEventListener("blur", () => setNote(id, ta.value.trim()));
  });

  render();
  startToastRotation();
  </script>
</body>
</html>
