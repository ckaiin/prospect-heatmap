<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Prospect Heat Map</title>

  <!-- Leaflet (map) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet.heat (heat layer) -->
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <!-- Real Westchester venue data (generated by build_data.py) -->
  <script src="restaurants.js"></script>
  <!-- Real new openings from NY SLA pending licenses (generated by openings_feed.py) -->
  <script src="openings.js"></script>
  <!-- Researched briefings for openings (generated by briefings_research). Optional. -->
  <script src="briefings.js"></script>

  <style>
    :root {
      --panel-bg: rgba(20, 24, 31, 0.92);
      --panel-fg: #e7ecf3;
      --accent: #ff7a45;
      --muted: #9aa6b6;
      --line: rgba(255, 255, 255, 0.12);
      --pulse: #ffffff;
    }
    body.light {
      --panel-bg: rgba(255, 255, 255, 0.94);
      --panel-fg: #1a2230;
      --accent: #e0611f;
      --muted: #5a6472;
      --line: rgba(0, 0, 0, 0.14);
      --pulse: #1a1a1a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { position: absolute; inset: 0; z-index: 0; }

    /* ---- Control panel ---- */
    .panel {
      position: absolute; top: 12px; left: 12px; z-index: 1000;
      width: 270px; max-width: calc(100vw - 24px);
      background: var(--panel-bg); color: var(--panel-fg);
      border: 1px solid var(--line); border-radius: 14px;
      padding: 14px 14px 12px; backdrop-filter: blur(8px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }
    .panel h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .2px; }
    .panel .sub { font-size: 11px; color: var(--muted); margin-bottom: 12px; }
    .panel .group { margin-bottom: 12px; }
    .panel .label { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 6px; }

    .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .mode {
      font-size: 12px; padding: 8px 6px; text-align: center; cursor: pointer;
      border: 1px solid var(--line); border-radius: 9px; background: transparent; color: var(--panel-fg);
      transition: all .12s ease;
    }
    .mode.active { background: var(--accent); border-color: var(--accent); color: #1a1005; font-weight: 600; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      font-size: 11px; padding: 5px 9px; cursor: pointer; user-select: none;
      border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted);
    }
    .chip.on { color: var(--panel-fg); border-color: var(--accent); background: rgba(255,122,69,.14); }

    .stat { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
    .stat b { color: var(--panel-fg); }

    .toggle-pins { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--panel-fg); cursor: pointer; }
    .toggle-pins input { accent-color: var(--accent); }

    .legend { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
    .legend .bar { height: 8px; border-radius: 4px; margin: 4px 0 3px;
      background: linear-gradient(90deg,#2b6bff,#37d67a,#ffd93b,#ff7a45,#ff2d2d); }
    .legend .ends { display: flex; justify-content: space-between; }

    .leaflet-popup-content { font-size: 13px; line-height: 1.45; min-width: 180px; }
    .leaflet-popup-content .p-cat { color: #b06a3f; font-weight: 600; }
    .leaflet-popup-content .p-row { color: #444; }
    .pv-status { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 6px; }
    .pv-btn { font-size: 11px; padding: 3px 8px; border: 1px solid #ccc; border-radius: 6px; background: #f4f4f4; cursor: pointer; text-transform: capitalize; color: #333; }
    .pv-btn:hover { border-color: #999; }
    .pv-btn.sel { background: #111; color: #fff; border-color: #111; font-weight: 600; }
    .pv-note { width: 100%; min-height: 40px; font-size: 12px; border: 1px solid #ccc; border-radius: 6px; padding: 5px; resize: vertical; font-family: inherit; box-sizing: border-box; }
    .brief { margin: 7px 0; padding: 7px 8px; background: #fbf4ee; border: 1px solid #f0dccb; border-radius: 7px; font-size: 12px; line-height: 1.4; max-height: 200px; overflow-y: auto; }
    .brief-empty { color: #777; background: #f5f5f5; border-color: #e5e5e5; }
    .brief-h { font-weight: 700; color: #b0561f; margin-bottom: 3px; }
    .brief-sum { margin-bottom: 4px; }
    .brief-spec { color: #999; font-weight: 400; font-style: italic; }
    .brief div { margin: 1px 0; }
    .brief-src { margin-top: 4px; border-top: 1px solid #eadfd2; padding-top: 3px; }
    .brief-cred { color: #888; font-size: 11px; }

    /* collapse toggle for small screens */
    .collapse-btn { position: absolute; top: 10px; right: 10px; background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; }
    .panel.collapsed .group, .panel.collapsed .stat, .panel.collapsed .legend, .panel.collapsed .sub { display: none; }

    /* ---- New-opening alert toast ---- */
    #toastWrap { position: absolute; top: 12px; right: 12px; z-index: 1100; width: 260px; max-width: calc(100vw - 24px); }
    .toast {
      background: var(--panel-bg); color: var(--panel-fg); border: 1px solid var(--accent);
      border-left: 4px solid var(--accent); border-radius: 12px; padding: 11px 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.4); backdrop-filter: blur(8px);
      cursor: pointer; animation: slideIn .3s ease;
    }
    @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }
    .toast .t-tag { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--accent); font-weight: 700; }
    .toast .t-name { font-size: 14px; font-weight: 600; margin: 2px 0; }
    .toast .t-meta { font-size: 11px; color: var(--muted); }
    .toast .t-close { position: absolute; top: 6px; right: 9px; color: var(--muted); font-size: 14px; }
    .toast .t-dots { display: flex; gap: 4px; margin-top: 8px; }
    .toast .t-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
    .toast .t-dot.on { background: var(--accent); }

    /* ---- Pulsing marker for new openings (SVG path, zoom-stable) ---- */
    path.opening-pulse { animation: mkpulse 1.8s ease-out infinite; stroke: var(--pulse); }
    @keyframes mkpulse {
      0%   { stroke-width: 2;  stroke-opacity: .9; }
      70%  { stroke-width: 13; stroke-opacity: 0;  }
      100% { stroke-width: 13; stroke-opacity: 0;  }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="toastWrap"></div>

  <div class="panel" id="panel">
    <button class="collapse-btn" id="collapseBtn" title="Collapse">–</button>
    <button class="collapse-btn" id="themeBtn" title="Toggle light/dark" style="right: 34px;">☀</button>
    <h1>Prospect Heat Map</h1>
    <div class="sub" id="dataSub">Real venues · Chefs' Warehouse fit score · chains removed</div>

    <div class="group">
      <div class="label">Heat represents</div>
      <div class="modes" id="modes"></div>
    </div>

    <div class="group">
      <div class="label">Category</div>
      <div class="chips" id="catChips"></div>
    </div>

    <div class="group">
      <div class="label">Status</div>
      <div class="chips" id="statusChips"></div>
    </div>

    <div class="group">
      <div class="label">Min fit score: <span id="minFitVal">0</span></div>
      <input type="range" id="minFitSlider" min="0" max="98" value="0" step="1" style="width:100%; accent-color: var(--accent);" />
    </div>

    <div class="group">
      <label class="toggle-pins"><input type="checkbox" id="pinsToggle" checked /> Show pins</label>
      <label class="toggle-pins" style="margin-top:8px"><input type="checkbox" id="newOnlyToggle" /> 🆕 New openings only</label>
    </div>

    <div class="stat" id="stat"></div>

    <div class="legend">
      <div class="bar"></div>
      <div class="ends"><span id="legLo">cold</span><span id="legHi">hot</span></div>
    </div>
  </div>

  <script>
  // ============================================================
  //  CONFIG — change these when you go live
  // ============================================================
  const CONFIG = {
    // Center of your territory: Westchester County, NY (near White Plains).
    // Zoom pulled back to show surrounding areas (lower Hudson Valley, Sound Shore, CT border).
    center: [41.0500, -73.7700],
    zoom: 11,
    // Categories present in the real Westchester data.
    categories: ["Restaurant", "Cafe", "Bar", "Bakery"],
  };

  // ============================================================
  //  HEAT MODES — each turns a prospect into a 0..1 weight.
  //  Add or edit modes freely.
  // ============================================================
  // Ranges filled in once PROSPECTS is built, so fit/pipeline stretch across the
  // full 0..1 heat range (otherwise dense point-count swamps the weighting).
  let FIT_MIN = 30, FIT_MAX = 98, VAL_MAX = 1;
  const norm = (v, lo, hi) => (hi > lo ? (v - lo) / (hi - lo) : 0.5);

  const MODES = {
    density:  { label: "Density",       weight: () => 1,                                              hint: ["few", "many"] },
    fit:      { label: "Fit score",     weight: p => 0.02 + 0.98 * Math.pow(norm(p.fitScore, FIT_MIN, FIT_MAX), 3), hint: ["poor fit", "great fit"] },
    pipeline: { label: "Pipeline $",    weight: p => 0.06 + 0.94 * norm(p.monthlyValue, 0, VAL_MAX),  hint: ["low $", "high $"] },
    coverage: { label: "Coverage gaps", weight: p => (p.status === "new" ? 1 : p.status === "contacted" ? 0.35 : 0.05), hint: ["worked", "untapped"] },
  };

  // ============================================================
  //  DATA — real Westchester venues from OpenStreetMap.
  //  Loaded from restaurants.js (window.REAL_RESTAURANTS).
  //  Real: name, category, cuisine, street, lat, lng.
  //  Placeholder until you prospect: status, fitScore, monthlyValue, opening.
  // ============================================================
  const STATUSES = ["new", "contacted", "customer", "not-interested"];
  // Existing venues (OSM) + real new openings (NY SLA pending licenses).
  const PROSPECTS = (window.REAL_RESTAURANTS || []).slice()
    .concat(window.REAL_OPENINGS || []);

  // Fill in the metric ranges used by the fit/pipeline heat modes.
  if (PROSPECTS.length) {
    FIT_MIN = Math.min(...PROSPECTS.map(p => p.fitScore));
    FIT_MAX = Math.max(...PROSPECTS.map(p => p.fitScore));
    VAL_MAX = Math.max(...PROSPECTS.map(p => p.monthlyValue)) || 1;
  }

  // ---- Visit tracker: saved on this device (localStorage) ----
  const STORE_KEY = "prospectTracker.v1";
  function loadStore() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; } }
  function saveStore() { localStorage.setItem(STORE_KEY, JSON.stringify(tracker)); }
  const tracker = loadStore();

  // Index prospects by string id, and overlay any saved status/notes.
  const BY_ID = {};
  PROSPECTS.forEach(p => {
    const key = String(p.id);
    BY_ID[key] = p;
    const t = tracker[key];
    if (t) { if (t.status) p.status = t.status; if (t.note) p.note = t.note; }
  });

  function setStatus(id, s) {
    const p = BY_ID[id]; if (!p) return;
    p.status = s;
    tracker[id] = Object.assign({}, tracker[id], { status: s, updated: Date.now() });
    saveStore(); render();
  }
  function setNote(id, note) {
    const p = BY_ID[id]; if (p) p.note = note;
    tracker[id] = Object.assign({}, tracker[id], { note: note, updated: Date.now() });
    saveStore();
  }

  // Human-readable label for a new-opening flag.
  function openingLabel(o) {
    if (!o) return "";
    if (o.type === "soon") return "Opening soon";
    return "Recently opened";
  }
  const BRIEFINGS = window.OPENING_BRIEFINGS || {};

  // Build the researched-briefing block for an opening popup (or a placeholder).
  function briefingHtml(id) {
    const b = BRIEFINGS[id];
    if (!b) return `<div class="brief brief-empty">🔎 No briefing yet — no public info found for this pre-opening spot.</div>`;
    const conf = b.confidence != null ? b.confidence : "?";
    const spec = b.speculative ? ` <span class="brief-spec">(informed guess)</span>` : "";
    let h = `<div class="brief"><div class="brief-h">🔎 Briefing · confidence ${conf}/10${spec}</div>`;
    if (b.summary) h += `<div class="brief-sum">${b.summary}</div>`;
    if (b.style) h += `<div><b>Style:</b> ${b.style}</div>`;
    if (b.menu) h += `<div><b>Menu:</b> ${b.menu}</div>`;
    if (b.cwSellers && b.cwSellers.length) h += `<div><b>Top products to sell them:</b> ${b.cwSellers.join(", ")}</div>`;
    if (b.angle) h += `<div><b>Pitch angle:</b> ${b.angle}</div>`;
    if (b.sources && b.sources.length) {
      h += `<div class="brief-src"><b>Sources:</b>` +
        b.sources.map(s => `<div>· <a href="${s.url}" target="_blank" rel="noopener">${s.label}</a> <span class="brief-cred">${s.cred}/10</span></div>`).join("") +
        `</div>`;
    }
    return h + `</div>`;
  }

  // Secondary detail line for openings (SLA stage / dates).
  function openingDetail(o) {
    if (!o) return "";
    if (o.type === "open") return `Licensed ${o.issued || "recently"}`;
    if (o.stage) return `Liquor license: ${o.stage}` + (o.received ? ` · filed ${o.received}` : "");
    if (o.received) return `Filed ${o.received}`;
    return o.source || "";
  }

  // ============================================================
  //  MAP
  // ============================================================
  const map = L.map("map", { zoomControl: true }).setView(CONFIG.center, CONFIG.zoom);

  // Theme-aware basemap (dark/light), remembered on this device.
  const TILE = {
    dark: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
    light: "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
  };
  let theme = localStorage.getItem("prospectTheme") || "dark";
  if (theme === "light") document.body.classList.add("light");
  let baseLayer = L.tileLayer(TILE[theme], { attribution: "&copy; OpenStreetMap &copy; CARTO", maxZoom: 20 }).addTo(map);

  function setTheme(t) {
    theme = t;
    document.body.classList.toggle("light", t === "light");
    map.removeLayer(baseLayer);
    baseLayer = L.tileLayer(TILE[t], { attribution: "&copy; OpenStreetMap &copy; CARTO", maxZoom: 20 }).addTo(map);
    localStorage.setItem("prospectTheme", t);
    const btn = document.getElementById("themeBtn");
    if (btn) btn.textContent = t === "light" ? "☾" : "☀";
    render();
  }

  let heatLayer = null;
  const markerLayer = L.layerGroup().addTo(map);

  // ============================================================
  //  STATE + UI
  // ============================================================
  const state = {
    mode: "density",
    cats: new Set(CONFIG.categories),
    statuses: new Set(STATUSES),
    showPins: true,
    newOnly: false,
    minFit: 0,
  };

  const STATUS_COLOR = { new: "#ff7a45", contacted: "#ffd93b", customer: "#37d67a", "not-interested": "#7a8290" };

  // Build mode buttons
  const modesEl = document.getElementById("modes");
  Object.entries(MODES).forEach(([key, m]) => {
    const b = document.createElement("button");
    b.className = "mode" + (key === state.mode ? " active" : "");
    b.textContent = m.label;
    b.onclick = () => { state.mode = key; document.querySelectorAll(".mode").forEach(x => x.classList.remove("active")); b.classList.add("active"); render(); };
    modesEl.appendChild(b);
  });

  // Build category chips
  const catEl = document.getElementById("catChips");
  CONFIG.categories.forEach(c => {
    const chip = document.createElement("div");
    chip.className = "chip on"; chip.textContent = c;
    chip.onclick = () => { toggleSet(state.cats, c); chip.classList.toggle("on"); render(); };
    catEl.appendChild(chip);
  });

  // Build status chips
  const statEl = document.getElementById("statusChips");
  STATUSES.forEach(s => {
    const chip = document.createElement("div");
    chip.className = "chip on"; chip.textContent = s;
    chip.onclick = () => { toggleSet(state.statuses, s); chip.classList.toggle("on"); render(); };
    statEl.appendChild(chip);
  });

  document.getElementById("pinsToggle").onchange = e => { state.showPins = e.target.checked; render(); };
  document.getElementById("newOnlyToggle").onchange = e => { state.newOnly = e.target.checked; render(); };
  document.getElementById("minFitSlider").oninput = e => {
    state.minFit = +e.target.value;
    document.getElementById("minFitVal").textContent = state.minFit;
    render();
  };
  document.getElementById("collapseBtn").onclick = () => document.getElementById("panel").classList.toggle("collapsed");
  document.getElementById("themeBtn").onclick = () => setTheme(theme === "light" ? "dark" : "light");
  document.getElementById("themeBtn").textContent = theme === "light" ? "☾" : "☀";

  function toggleSet(set, v) { set.has(v) ? set.delete(v) : set.add(v); }

  // ============================================================
  //  RENDER
  // ============================================================
  function visibleProspects() {
    return PROSPECTS.filter(p =>
      state.cats.has(p.category) &&
      state.statuses.has(p.status) &&
      p.fitScore >= state.minFit &&
      (!state.newOnly || p.opening)
    );
  }

  function render() {
    const shown = visibleProspects();
    const mode = MODES[state.mode];
    const light = document.body.classList.contains("light");
    const openFill = light ? "#1a1a1a" : "#ffffff";
    const openStroke = light ? "#ffffff" : "#1a1a1a";

    // Heat layer
    const points = shown.map(p => [p.lat, p.lng, Math.max(mode.weight(p), 0.05)]);
    if (heatLayer) map.removeLayer(heatLayer);
    heatLayer = L.heatLayer(points, {
      radius: 22, blur: 17, maxZoom: 17, minOpacity: 0.3, max: 4.5,
      gradient: { 0.0: "#2b6bff", 0.35: "#37d67a", 0.6: "#ffd93b", 0.8: "#ff7a45", 1.0: "#ff2d2d" },
    }).addTo(map);

    // Pins
    markerLayer.clearLayers();
    if (state.showPins) {
      shown.forEach(p => {
        const cuisineBit = p.cuisine ? ` · ${p.cuisine}` : "";
        const streetBit = p.street ? `<span class="p-row">${p.street}</span><br>` : "";
        const statusBtns = STATUSES.map(s =>
          `<button class="pv-btn ${p.status === s ? "sel" : ""}" data-status="${s}">${s.replace("-", " ")}</button>`).join("");
        const popupHtml =
          `<div class="pv" data-id="${String(p.id)}">` +
          `<b>${p.name}</b><br>` +
          (p.opening ? `<span style="color:#c94a1e;font-weight:600">🆕 ${openingLabel(p.opening)}</span><br><span class="p-row">${openingDetail(p.opening)}</span><br>` + briefingHtml(String(p.id)) : "") +
          `<span class="p-cat">${p.category}${cuisineBit}</span><br>` +
          streetBit +
          `<span class="p-row">Est. fit ${p.fitScore}/100 · ~$${p.monthlyValue}/mo</span>` +
          `<div class="pv-status">${statusBtns}</div>` +
          `<textarea class="pv-note" placeholder="Notes (saved automatically)…">${p.note || ""}</textarea>` +
          `</div>`;

        let marker;
        if (p.opening) {
          // Openings are white circleMarkers (SVG, zoom-stable). "Opening soon"
          // pulses (still coming); "just opened" is a static white dot.
          if (p.opening.type === "soon") {
            L.circleMarker([p.lat, p.lng], {
              radius: 6, color: "#ffffff", weight: 2, fill: false, className: "opening-pulse", interactive: false,
            }).addTo(markerLayer);
          }
          marker = L.circleMarker([p.lat, p.lng], {
            radius: 6, color: openStroke, weight: 1.5, fillColor: openFill, fillOpacity: 1,
          });
        } else {
          marker = L.circleMarker([p.lat, p.lng], {
            radius: 5, color: "#000", weight: 1, fillColor: STATUS_COLOR[p.status], fillOpacity: 0.9,
          });
        }
        marker.bindPopup(popupHtml).addTo(markerLayer);
      });
    }

    // Stats
    const totalVal = shown.reduce((a, p) => a + p.monthlyValue, 0);
    const contacted = PROSPECTS.filter(p => p.status === "contacted").length;
    const customers = PROSPECTS.filter(p => p.status === "customer").length;
    document.getElementById("stat").innerHTML =
      `<b>${shown.length}</b> shown · <b>$${totalVal.toLocaleString()}</b>/mo potential<br>` +
      `<b>${contacted}</b> contacted · <b>${customers}</b> customers`;

    // Legend labels reflect current mode
    document.getElementById("legLo").textContent = mode.hint[0];
    document.getElementById("legHi").textContent = mode.hint[1];
  }

  // ============================================================
  //  NEW-OPENING AUTO ALERT (rotating toast, top-right)
  //  Soonest/most-recent openings first. Click to fly there.
  //  In production this list is fed by the live openings feed;
  //  a new arrival re-triggers showToast().
  // ============================================================
  const STAGE_RANK = { "Conditionally Approved": 3, "Under Review": 2, "IntakeComplete": 1, "Reconsideration": 1 };
  const openings = PROSPECTS
    .filter(p => p.opening)
    .sort((a, b) => (STAGE_RANK[b.opening.stage] || 0) - (STAGE_RANK[a.opening.stage] || 0)); // closest-to-open first

  let toastIdx = 0, toastTimer = null;

  function showToast() {
    const wrap = document.getElementById("toastWrap");
    if (!openings.length) { wrap.innerHTML = ""; return; }
    const p = openings[toastIdx % openings.length];
    const tag = openingLabel(p.opening);
    const dots = openings.map((_, i) => `<span class="t-dot ${i === toastIdx % openings.length ? "on" : ""}"></span>`).join("");

    wrap.innerHTML =
      `<div class="toast" id="toast">
         <span class="t-close" id="toastClose">✕</span>
         <div class="t-tag">🆕 ${tag} · ${p.category}</div>
         <div class="t-name">${p.name}</div>
         <div class="t-meta">${openingDetail(p.opening)} · tap to locate</div>
         <div class="t-dots">${dots}</div>
       </div>`;

    document.getElementById("toast").onclick = () => {
      map.flyTo([p.lat, p.lng], 15, { duration: 0.8 });
      markerLayer.eachLayer(l => { if (l.getLatLng && Math.abs(l.getLatLng().lat - p.lat) < 1e-6) l.openPopup(); });
    };
    document.getElementById("toastClose").onclick = e => { e.stopPropagation(); clearInterval(toastTimer); wrap.innerHTML = ""; };
  }

  function startToastRotation() {
    if (!openings.length) return;
    showToast();
    toastTimer = setInterval(() => { toastIdx++; showToast(); }, 5000); // cycle every 5s
  }

  // Wire up the tracker controls whenever a popup opens.
  map.on("popupopen", e => {
    const node = e.popup.getElement();
    const wrap = node && node.querySelector(".pv");
    if (!wrap) return;
    const id = wrap.getAttribute("data-id");
    wrap.querySelectorAll(".pv-btn").forEach(b =>
      b.addEventListener("click", () => setStatus(id, b.getAttribute("data-status"))));
    const ta = wrap.querySelector(".pv-note");
    if (ta) ta.addEventListener("blur", () => setNote(id, ta.value.trim()));
  });

  render();
  startToastRotation();
  </script>
</body>
</html>
