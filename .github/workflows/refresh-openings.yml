name: Refresh openings

# Auto-refresh the new-opening alerts from the NY State Liquor Authority feed.
on:
  schedule:
    - cron: "0 12 * * 1"   # every Monday at 12:00 UTC
  workflow_dispatch: {}     # ...or run manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild openings.js from NY SLA
        run: python3 openings_feed.py

      - name: Commit if the openings changed
        run: |
          if ! git diff --quiet openings.js; then
            git config user.name "openings-bot"
            git config user.email "actions@users.noreply.github.com"
            git add openings.js
            git commit -m "Auto-refresh openings ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes in openings.js — nothing to commit."
          fi
